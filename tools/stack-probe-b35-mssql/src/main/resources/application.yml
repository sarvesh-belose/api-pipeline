spring:
  application.name: apiorch-stack-probe
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      # Instant defaults to TIMESTAMP_UTC, which reads DATETIME2 in the JVM zone and ignores jdbc.time_zone
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  datasource:
    # fast tier: H2 in MSSQL mode; the SQL Server IT replaces this with @ServiceConnection
    url: jdbc:h2:mem:apiorch;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
management:
  server.port: 0
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
eureka.client.enabled: false
probe.jwt.secret: 0123456789abcdef0123456789abcdef
