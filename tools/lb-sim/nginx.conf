# US-1.4 load-balancer simulation: two apiorch nodes on this host behind nginx in Docker, standing in for the R1
# environment's HTTPS load balancer. See docs/deployment-guide.md ("Local simulation").
events {}

http {
    upstream apiorch {
        server host.docker.internal:18081 max_fails=1 fail_timeout=5s;
        server host.docker.internal:18082 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        location / {
            # no URI on proxy_pass: the path and query string go through unchanged (AC3)
            proxy_pass http://apiorch;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # what TLS termination at the real load balancer would send (AC2)
            proxy_set_header Host apiorch.test.example.internal;
            proxy_set_header X-Forwarded-Host apiorch.test.example.internal;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # a node that is shutting down answers 503 shutting-down without creating the run, so the request can
            # safely go to the other node (AC6); OSS nginx has no active health checks, see the guide
            proxy_next_upstream error timeout http_503 non_idempotent;
            proxy_read_timeout 60s;
        }
    }
}
