# Optional SQL Server 2022 for production parity (US-1.1). The `local` profile needs no database service:
# it runs on H2 in-memory. To use this one, start it and point SPRING_DATASOURCE_URL/USERNAME/PASSWORD at it.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ["1433:1433"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD for the local SQL Server}
    profiles: ["mssql"]
