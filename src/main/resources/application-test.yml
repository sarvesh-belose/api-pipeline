# Fast test tier: H2 in SQL Server mode. `slow` tests replace the datasource with SQL Server (@ServiceConnection).
spring:
  datasource:
    url: jdbc:h2:mem:apiorch-test;MODE=MSSQLServer;DATABASE_TO_UPPER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    hikari.maximum-pool-size: 10
management:
  server.port: 0   # random, so parallel local test runs do not collide
apiorch:
  endpoints:
    allow-http: true
    allowed-hosts: [localhost, "*.example.com"]
  run:
    allow-version-override: true
  context:
    # a fixed, test-only key under src/test/resources (US-7.6); never a production key
    encryption-keys:
      t1: file:${user.dir}/src/test/resources/test-secrets/context-t1.key
    active-kid: t1
