spring:
  application.name: apiorch-service
  mvc.problemdetails.enabled: true
  jpa:
    open-in-view: false
    hibernate.ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      # Instant defaults to TIMESTAMP_UTC, which reads DATETIME2 in the JVM zone (ADR-003 F6)
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  # Boot's ObjectMapper sets this false (ADR-003 F7)
  jackson.deserialization.fail-on-unknown-properties: true
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  datasource.hikari.maximum-pool-size: 80   # sized with step-io, README §14; never the default 10
  lifecycle.timeout-per-shutdown-phase: 30s
  mvc.async.request-timeout: 35s

server:
  port: 8080
  shutdown: graceful
  # US-1.4: links (Location, callback URLs) use the load balancer's scheme and host, trusted only from these proxies
  forward-headers-strategy: native
  tomcat.remoteip.internal-proxies: ${APIORCH_TRUSTED_PROXIES:10\.\d+\.\d+\.\d+}

management:
  server.port: 9091
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: readinessState,db
