# Sprint 0, S2: test tiers from README §13.
#  - fast + component (H2 in MSSQL mode, no Docker): every push and pull request; gates merges.
#  - slow (Testcontainers SQL Server 2022): nightly and on demand; a red run blocks the next release candidate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST
  workflow_dispatch:
    inputs:
      slow:
        description: Also run the slow tier (SQL Server)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (fast + component)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test (H2)
        run: ./mvnw -B -ntp verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-verify
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 14

  slow:
    name: verify -Pslow (SQL Server 2022)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slow)
    runs-on: ubuntu-latest   # GitHub-hosted runners provide Docker for Testcontainers
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Pre-pull SQL Server image
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest
      - name: Build and test (H2 + SQL Server)
        run: ./mvnw -B -ntp verify -Pslow
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-slow
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          retention-days: 14
